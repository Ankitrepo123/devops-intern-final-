server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          container: devops-intern-nginx
          service: nginx-app
          nomad_alloc_id: local-dev
          __path__: /var/lib/docker/containers/*/*-json.log
